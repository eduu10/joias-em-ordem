<!doctype html><meta charset="utf-8"><canvas width="1080" height="1620"></canvas><script>
const TAU=Math.PI*2;
// Numeros de balanceamento. O jogo e desenhado num espaco fixo de 360 x 640 e escalado para a tela.
const DESIGN = Object.freeze({ w: 360, h: 640 });

const SCREEN = Object.freeze({
  HOME: 'home', CATEGORY: 'category', MATCH: 'match', RESULT: 'result', SHOP: 'shop',
});

const PHASE = Object.freeze({ READY: 'ready', PLAY: 'play', FEEDBACK: 'feedback', DONE: 'done' });

const OUTCOME = Object.freeze({ WIN: 'win', TIE: 'tie', LOSE: 'lose' });

const CATEGORY = Object.freeze({
  CLASSICAL: 'classical', STAGE: 'stage', FOLK: 'folk', CANTIGAS: 'cantigas', MIX: 'mix',
});

// Ordem em que as categorias aparecem na tela de escolha.
const CATEGORY_ORDER = Object.freeze([
  CATEGORY.CLASSICAL, CATEGORY.STAGE, CATEGORY.FOLK, CATEGORY.CANTIGAS, CATEGORY.MIX,
]);

const CONFIG = Object.freeze({
  rounds: 5,
  options: 4,
  roundSeconds: 10,
  readySeconds: 1.1,
  feedbackSeconds: 2.8,
  maxPoints: 100,
  minCorrectPoints: 10,

  // Rival controlado pelo jogo: fica mais rapido e mais certeiro conforme o nivel do jogador.
  rivalAccuracyBase: 0.48,
  rivalAccuracyPerLevel: 0.025,
  rivalAccuracyMax: 0.8,
  rivalDelayMin: 3.4,
  rivalDelayMax: 8.6,
  rivalDelayPerLevel: 0.12,
  rivalDelayFloorMin: 2.2,
  rivalDelayFloorMax: 5.6,

  coinsWin: 30,
  coinsTie: 15,
  coinsLose: 5,
  streakBonusPerWin: 5,
  streakBonusCap: 25,
  doubleCoinsFactor: 2,
  homeAdCoins: 50,
  xpPerPoint: 0.2,
  xpWin: 30,
  xpTie: 15,
  xpLose: 8,
  xpLevelBase: 60,
  xpLevelStep: 30,
  maxLevel: 99,

  recentLimit: 14,
  interstitialEveryMatches: 3,
  tuneGapBeats: 3,
  maxFrameSeconds: 0.05,
  saveVersion: 1,
});

// Itens da lojinha: so enfeite. `kind` diz o que o item troca.
const SHOP_KIND = Object.freeze({ INSTRUMENT: 'instrument', FRAME: 'frame' });

const SHOP_ITEMS = Object.freeze([
  Object.freeze({ id: 'frame-gold', kind: SHOP_KIND.FRAME, price: 80 }),
  Object.freeze({ id: 'inst-musicbox', kind: SHOP_KIND.INSTRUMENT, price: 120, preset: 'musicbox' }),
  Object.freeze({ id: 'frame-neon', kind: SHOP_KIND.FRAME, price: 160 }),
  Object.freeze({ id: 'inst-strings', kind: SHOP_KIND.INSTRUMENT, price: 200, preset: 'strings' }),
  Object.freeze({ id: 'frame-star', kind: SHOP_KIND.FRAME, price: 260 }),
]);

const REWARD_ID_REMATCH = 'rematch-double-coins';
const REWARD_ID_HOME_COINS = 'home-bonus-coins';

// Ajudantes de desenho usados por todos os modulos visuais.
const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const hsl = ([h, s, l], lightShift = 0, alpha = 1) =>
  `hsl(${h} ${s}% ${Math.min(100, Math.max(0, l + lightShift))}% / ${alpha})`;

let roundRectPath = (ctx, x, y, w, h, radius) => {
  const r = Math.min(radius, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

const drawText = (ctx, text, x, y, size, options = {}) => {
  const { color = '#ffffff', weight = 800, align = 'center', shadow = true } = options;
  ctx.font = `${weight} ${Math.round(size)}px ${FONT_STACK}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.fillStyle = 'rgba(20, 8, 50, 0.45)';
    ctx.fillText(text, x, y + Math.max(1, size * 0.07));
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
};

// Reduz o tamanho da fonte ate o texto caber na largura dada.
const fitText = (ctx, text, maxWidth, size, weight = 800) => {
  ctx.font = `${weight} ${Math.round(size)}px ${FONT_STACK}`;
  const width = ctx.measureText(text).width;
  return width <= maxWidth ? size : size * (maxWidth / width);
};

// Palco: fundo com holofotes e notas flutuando, o disco que gira, o equalizador e o anel do tempo.
// Tudo desenhado a partir do tempo e do estado recebido. Nao guarda nem altera nada.

const NOTE_COUNT = 16;
const BEAMS = Object.freeze([
  { at: 0.12, hue: 48, speed: 0.5, phase: 0 },
  { at: 0.38, hue: 322, speed: 0.37, phase: 1.7 },
  { at: 0.64, hue: 176, speed: 0.44, phase: 3.1 },
  { at: 0.9, hue: 276, speed: 0.31, phase: 4.6 },
]);

// Numero "aleatorio" fixo por indice: o fundo e igual a cada quadro sem guardar estado.
const hash = (n) => {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
};

const drawNoteGlyph = (ctx, x, y, size, color, double = false) => {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = size * 0.14;
  ctx.lineCap = 'round';
  const heads = double ? [-size * 0.5, size * 0.5] : [0];
  heads.forEach((hx) => {
    ctx.beginPath();
    ctx.ellipse(hx, size * 0.5, size * 0.34, size * 0.25, -0.4, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hx + size * 0.3, size * 0.45);
    ctx.lineTo(hx + size * 0.3, -size * 0.6);
    ctx.stroke();
  });
  ctx.beginPath();
  if (double) {
    ctx.lineWidth = size * 0.24;
    ctx.moveTo(-size * 0.2, -size * 0.6);
    ctx.lineTo(size * 0.8, -size * 0.6);
  } else {
    ctx.moveTo(size * 0.3, -size * 0.6);
    ctx.quadraticCurveTo(size * 0.85, -size * 0.35, size * 0.6, size * 0.05);
  }
  ctx.stroke();
  ctx.restore();
};

const drawBeams = (ctx, width, height, time, energy) => {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  BEAMS.forEach((beam) => {
    const x = width * beam.at;
    const sway = Math.sin(time * beam.speed + beam.phase) * 0.32;
    const reach = height * 1.05;
    const spread = width * 0.16;
    const tx = x + Math.sin(sway) * reach;
    const fill = ctx.createLinearGradient(x, 0, tx, reach);
    fill.addColorStop(0, `hsl(${beam.hue} 95% 70% / ${0.2 + energy * 0.14})`);
    fill.addColorStop(1, `hsl(${beam.hue} 95% 60% / 0)`);
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x - 4, -10);
    ctx.lineTo(x + 4, -10);
    ctx.lineTo(tx + spread, reach);
    ctx.lineTo(tx - spread, reach);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
};

const drawFloatingNotes = (ctx, width, height, time) => {
  const unit = Math.min(width, height);
  for (let i = 0; i < NOTE_COUNT; i += 1) {
    const size = unit * (0.022 + hash(i) * 0.03);
    const travel = height + size * 6;
    const y = height + size * 3 - ((time * (14 + hash(i + 40) * 22) + hash(i + 80) * travel) % travel);
    const x = hash(i + 120) * width + Math.sin(time * (0.5 + hash(i + 160)) + i) * unit * 0.03;
    const fade = Math.min(1, y / (height * 0.25), (height - y) / (height * 0.2) + 0.2);
    const hue = [48, 176, 322, 276][i % 4];
    ctx.globalAlpha = Math.max(0, fade) * 0.28;
    drawNoteGlyph(ctx, x, y, size, `hsl(${hue} 90% 78%)`, i % 3 === 0);
  }
  ctx.globalAlpha = 1;
};

// Fundo que cobre a tela inteira (em pixels da tela), para nao sobrar faixa preta em nenhum formato.
const drawBackdrop = (ctx, view, time, energy = 0) => {
  const { width, height } = view;
  ctx.setTransform(view.ratio, 0, 0, view.ratio, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, height);
  sky.addColorStop(0, '#12062e');
  sky.addColorStop(0.55, '#2c0f55');
  sky.addColorStop(1, '#5a1458');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  drawBeams(ctx, width, height, time, energy);
  const glow = ctx.createRadialGradient(width / 2, height * 1.05, 0, width / 2, height * 1.05, Math.max(width, height) * 0.6);
  glow.addColorStop(0, `rgba(255, 140, 90, ${0.34 + energy * 0.2})`);
  glow.addColorStop(1, 'rgba(255, 140, 90, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);
  drawFloatingNotes(ctx, width, height, time);
  const shade = ctx.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.35, width / 2, height / 2, Math.max(width, height) * 0.75);
  shade.addColorStop(0, 'rgba(8, 2, 24, 0)');
  shade.addColorStop(1, 'rgba(8, 2, 24, 0.55)');
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, width, height);
};

// Disco de vinil. `spin` em radianos, `hue` da etiqueta, `pulse` de 0 a 1 faz o brilho bater com a musica.
const drawVinyl = (ctx, x, y, radius, spin, hue, pulse = 0) => {
  ctx.save();
  ctx.translate(x, y);
  const halo = ctx.createRadialGradient(0, 0, radius * 0.8, 0, 0, radius * (1.35 + pulse * 0.15));
  halo.addColorStop(0, `hsl(${hue} 95% 65% / ${0.35 + pulse * 0.35})`);
  halo.addColorStop(1, `hsl(${hue} 95% 65% / 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 1.5, 0, TAU);
  ctx.fill();

  ctx.rotate(spin);
  ctx.fillStyle = '#120a1e';
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
  ctx.lineWidth = 1;
  for (let ring = 0.46; ring < 0.97; ring += 0.085) {
    ctx.beginPath();
    ctx.arc(0, 0, radius * ring, 0, TAU);
    ctx.stroke();
  }
  // Reflexos em cunha deixam o giro visivel.
  [0, Math.PI].forEach((angle) => {
    const shine = ctx.createLinearGradient(0, 0, Math.cos(angle) * radius, Math.sin(angle) * radius);
    shine.addColorStop(0.4, 'rgba(255, 255, 255, 0)');
    shine.addColorStop(1, 'rgba(255, 255, 255, 0.2)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius * 0.98, angle - 0.22, angle + 0.22);
    ctx.closePath();
    ctx.fill();
  });
  const label = ctx.createLinearGradient(-radius * 0.4, -radius * 0.4, radius * 0.4, radius * 0.4);
  label.addColorStop(0, `hsl(${hue} 90% 68%)`);
  label.addColorStop(1, `hsl(${hue + 40} 85% 48%)`);
  ctx.fillStyle = label;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.4, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.lineWidth = radius * 0.025;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.33, 0.3, 2.2);
  ctx.stroke();
  ctx.restore();
};

// Barras do equalizador. `bars` sao valores de 0 a 1; a cor vai do verde-agua ao dourado e ao rosa.
const drawEqualiser = (ctx, rect, bars, time) => {
  const gap = 3;
  const barW = (rect.w - gap * (bars.length - 1)) / bars.length;
  bars.forEach((value, index) => {
    const idle = 0.08 + 0.05 * Math.sin(time * 3 + index * 0.9);
    const level = Math.min(1, Math.max(idle, value));
    const h = Math.max(3, rect.h * level);
    const x = rect.x + index * (barW + gap);
    const hue = 176 - (index / bars.length) * 190;
    const fill = ctx.createLinearGradient(0, rect.y + rect.h - h, 0, rect.y + rect.h);
    fill.addColorStop(0, `hsl(${hue} 95% 72%)`);
    fill.addColorStop(1, `hsl(${hue} 90% 48% / 0.55)`);
    ctx.fillStyle = fill;
    roundRectPath(ctx, x, rect.y + rect.h - h, barW, h, barW / 2);
    ctx.fill();
  });
};

// Anel do tempo em volta do disco: `share` de 1 (cheio) a 0 (acabou).
const drawTimerRing = (ctx, x, y, radius, share, time) => {
  const urgent = share < 0.3;
  ctx.lineCap = 'round';
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, TAU);
  ctx.stroke();
  if (share <= 0) return;
  const hue = 40 + share * 120;
  const beat = urgent ? 0.5 + 0.5 * Math.sin(time * 14) : 0;
  ctx.strokeStyle = `hsl(${urgent ? 352 : hue} 95% ${62 + beat * 14}%)`;
  ctx.lineWidth = 7 + beat * 2;
  ctx.beginPath();
  ctx.arc(x, y, radius, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, share));
  ctx.stroke();
};

// Avatares: o jogador (carinha com fone de ouvido) e o rival, um robozinho que deixa claro que e o computador.

const MOOD = Object.freeze({ IDLE: 'idle', THINK: 'think', HAPPY: 'happy', SAD: 'sad' });

const blinking = (time, offset) => (time + offset) % 3.4 < 0.12;

const drawMouth = (ctx, mood, y, width) => {
  ctx.lineWidth = width * 0.16;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (mood === MOOD.HAPPY) ctx.arc(0, y - width * 0.25, width * 0.55, 0.25, Math.PI - 0.25);
  else if (mood === MOOD.SAD) ctx.arc(0, y + width * 0.55, width * 0.5, Math.PI + 0.45, TAU - 0.45);
  else if (mood === MOOD.THINK) ctx.arc(width * 0.1, y + width * 0.05, width * 0.16, 0, TAU);
  else ctx.arc(0, y - width * 0.1, width * 0.4, 0.4, Math.PI - 0.4);
  ctx.stroke();
};

// Moldura comprada na lojinha (ou a padrao) em volta do avatar do jogador.
const drawFrame = (ctx, x, y, radius, frameId, time) => {
  ctx.save();
  ctx.translate(x, y);
  ctx.lineWidth = radius * 0.13;
  if (frameId === 'frame-gold') {
    const gold = ctx.createLinearGradient(-radius, -radius, radius, radius);
    gold.addColorStop(0, '#fff3b0');
    gold.addColorStop(0.5, '#ffb62e');
    gold.addColorStop(1, '#fff3b0');
    ctx.strokeStyle = gold;
    ctx.lineWidth = radius * 0.2;
  } else if (frameId === 'frame-neon') {
    ctx.shadowColor = '#3df5e0';
    ctx.shadowBlur = radius * (0.4 + 0.2 * Math.sin(time * 5));
    ctx.strokeStyle = '#3df5e0';
  } else if (frameId === 'frame-star') {
    ctx.strokeStyle = '#ff7ad1';
  } else {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = radius * 0.09;
  }
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.stroke();
  ctx.shadowBlur = 0;
  if (frameId === 'frame-star') {
    for (let i = 0; i < 6; i += 1) {
      const angle = time * 0.8 + (i * TAU) / 6;
      const size = radius * (0.16 + 0.04 * Math.sin(time * 4 + i));
      ctx.fillStyle = i % 2 ? '#ffe066' : '#ffffff';
      ctx.beginPath();
      for (let p = 0; p < 10; p += 1) {
        const r = p % 2 ? size * 0.45 : size;
        const a = (p * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(angle) * radius + Math.cos(a) * r, Math.sin(angle) * radius + Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
};

const drawPlayer = (ctx, x, y, radius, options = {}) => {
  const { mood = MOOD.IDLE, time = 0, frameId = null } = options;
  ctx.save();
  ctx.translate(x, y);
  const back = ctx.createLinearGradient(0, -radius, 0, radius);
  back.addColorStop(0, '#ff8a5c');
  back.addColorStop(1, '#d6336c');
  ctx.fillStyle = back;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.fill();
  // Rosto
  const face = radius * 0.58;
  ctx.fillStyle = '#ffe2a8';
  ctx.beginPath();
  ctx.arc(0, radius * 0.08, face, 0, TAU);
  ctx.fill();
  // Fone de ouvido
  ctx.strokeStyle = '#2b1657';
  ctx.lineWidth = radius * 0.14;
  ctx.beginPath();
  ctx.arc(0, radius * 0.04, face * 1.08, Math.PI * 1.08, Math.PI * 1.92);
  ctx.stroke();
  ctx.fillStyle = '#3df5e0';
  [-1, 1].forEach((side) => {
    roundRectPath(ctx, side * face * 1.02 - radius * 0.13, -radius * 0.12, radius * 0.26, radius * 0.46, radius * 0.1);
    ctx.fill();
  });
  // Olhos e boca
  ctx.fillStyle = '#2b1657';
  ctx.strokeStyle = '#2b1657';
  const closed = blinking(time, 0.6) || mood === MOOD.HAPPY;
  [-1, 1].forEach((side) => {
    ctx.beginPath();
    if (closed) ctx.ellipse(side * face * 0.38, radius * 0.02, radius * 0.1, radius * 0.03, 0, 0, TAU);
    else ctx.arc(side * face * 0.38, radius * 0.02, radius * 0.08, 0, TAU);
    ctx.fill();
  });
  drawMouth(ctx, mood, radius * 0.3, radius * 0.34);
  ctx.restore();
  drawFrame(ctx, x, y, radius, frameId, time);
};

// O rival: robo com antena de nota musical. `mood` muda os olhos e a boca.
const drawRobot = (ctx, x, y, radius, options = {}) => {
  const { mood = MOOD.IDLE, time = 0 } = options;
  ctx.save();
  ctx.translate(x, y);
  const back = ctx.createLinearGradient(0, -radius, 0, radius);
  back.addColorStop(0, '#3b2a8c');
  back.addColorStop(1, '#1d1450');
  ctx.fillStyle = back;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.clip();
  // Antena
  const wobble = Math.sin(time * 4) * radius * 0.05;
  ctx.strokeStyle = '#b9c4e8';
  ctx.lineWidth = radius * 0.08;
  ctx.beginPath();
  ctx.moveTo(0, -radius * 0.42);
  ctx.lineTo(wobble, -radius * 0.74);
  ctx.stroke();
  ctx.fillStyle = mood === MOOD.THINK ? '#ffe066' : '#ff7ad1';
  ctx.beginPath();
  ctx.arc(wobble, -radius * 0.78, radius * 0.11, 0, TAU);
  ctx.fill();
  // Cabeca
  const w = radius * 1.2;
  const h = radius * 0.92;
  const head = ctx.createLinearGradient(0, -h / 2, 0, h / 2 + radius * 0.1);
  head.addColorStop(0, '#e6ecff');
  head.addColorStop(1, '#93a3d6');
  ctx.fillStyle = '#6f7fb8';
  [-1, 1].forEach((side) => {
    roundRectPath(ctx, side * (w / 2 + radius * 0.02) - radius * 0.09, -radius * 0.08, radius * 0.18, radius * 0.34, radius * 0.06);
    ctx.fill();
  });
  roundRectPath(ctx, -w / 2, -radius * 0.42, w, h, radius * 0.26);
  ctx.fillStyle = head;
  ctx.fill();
  // Visor com olhos de LED
  roundRectPath(ctx, -w * 0.39, -radius * 0.27, w * 0.78, radius * 0.4, radius * 0.14);
  ctx.fillStyle = '#16103a';
  ctx.fill();
  const led = mood === MOOD.SAD ? '#ff6b7d' : '#3df5e0';
  ctx.fillStyle = led;
  ctx.strokeStyle = led;
  const shut = blinking(time, 1.9);
  [-1, 1].forEach((side) => {
    const ex = side * w * 0.2 + (mood === MOOD.THINK ? Math.sin(time * 3) * radius * 0.05 : 0);
    ctx.beginPath();
    if (mood === MOOD.HAPPY) {
      ctx.lineWidth = radius * 0.07;
      ctx.arc(ex, -radius * 0.03, radius * 0.09, Math.PI, TAU);
      ctx.stroke();
    } else {
      ctx.ellipse(ex, -radius * 0.07, radius * 0.08, shut ? radius * 0.015 : radius * 0.1, 0, 0, TAU);
      ctx.fill();
    }
  });
  ctx.strokeStyle = '#3b2a8c';
  drawMouth(ctx, mood, radius * 0.3, radius * 0.26);
  ctx.restore();
  ctx.strokeStyle = '#8fa2ff';
  ctx.lineWidth = radius * 0.09;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.stroke();
  ctx.restore();
  if (mood === MOOD.THINK) drawNoteGlyph(ctx, x + radius * 0.95, y - radius * 0.75 + Math.sin(time * 5) * 2, radius * 0.3, '#ffe066');
};

roundRectPath = (ctx,x,y,w,h,r) => {
 r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
};


const c=document.querySelector('canvas'),ctx=c.getContext('2d');
const W=c.width,H=c.height,P=H>W;
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function star(x,y,r,color='#fff6ba'){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=20;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,rr=i%2?r*.19:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function burst(x,y,r,color){ctx.save();ctx.translate(x,y);for(let i=0;i<26;i++){ctx.rotate(Math.PI*2/26);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r,-r*.028);ctx.lineTo(r,r*.028);ctx.fill()}ctx.restore()}
function trail(ax,ay,bx,by,cx,cy,color,width){ctx.save();ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=22;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(bx,by,cx,cy);ctx.stroke();ctx.strokeStyle='#fffde6';ctx.lineWidth=width*.28;ctx.stroke();ctx.restore()}
function title(lines,ys,maxWidth,size,x){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';lines.forEach((line,i)=>{ctx.font=`1000 ${size}px "Arial Black", "Segoe UI", sans-serif`;let s=size*Math.min(1,maxWidth/ctx.measureText(line).width);ctx.font=`1000 ${s}px "Arial Black", "Segoe UI", sans-serif`;ctx.shadowColor='#9d56ff';ctx.shadowBlur=30;ctx.strokeStyle='#190b38';ctx.lineWidth=23;ctx.strokeText(line,x,ys[i]+8);ctx.shadowBlur=0;ctx.strokeStyle='#190b38';ctx.lineWidth=17;ctx.strokeText(line,x,ys[i]);ctx.strokeStyle='#ffe5a3';ctx.lineWidth=3;ctx.strokeText(line,x,ys[i]);let g=ctx.createLinearGradient(0,ys[i]-s*.5,0,ys[i]+s*.5);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#fff5b9');g.addColorStop(1,'#ffbb36');ctx.fillStyle=g;ctx.fillText(line,x,ys[i])});ctx.restore()}
