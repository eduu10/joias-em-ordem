<!doctype html><meta charset="utf-8"><canvas width="1280" height="720"></canvas><script>
const PLAYER_SCALE=1;
// Ajudantes de desenho usados por todos os modulos visuais.
const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const hsl = ([h, s, l], lightShift = 0, alpha = 1) =>
  `hsl(${h} ${s}% ${Math.min(100, Math.max(0, l + lightShift))}% / ${alpha})`;

const roundRectPath = (ctx, x, y, w, h, radius) => {
  const r = Math.min(radius, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

const drawText = (ctx, text, x, y, size, options = {}) => {
  const { color = '#ffffff', weight = 800, align = 'center', shadow = true } = options;
  ctx.font = `${weight} ${Math.round(size)}px ${FONT_STACK}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.fillStyle = 'rgba(20, 8, 50, 0.45)';
    ctx.fillText(text, x, y + Math.max(1, size * 0.07));
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
};

// Reduz o tamanho da fonte ate o texto caber na largura dada.
const fitText = (ctx, text, maxWidth, size, weight = 800) => {
  ctx.font = `${weight} ${Math.round(size)}px ${FONT_STACK}`;
  const width = ctx.measureText(text).width;
  return width <= maxWidth ? size : size * (maxWidth / width);
};

// O personagem: um robo entregador redondinho, com um pacote nas costas e uma antena.
// E desenhado em "pixels na distancia do robo" e escalado pela perspectiva.
const TAU = Math.PI * 2;
const BODY_Y = -38;
const BODY_R = 27;
const INK = '#2b2350';
const TEAL = '#22c7b8';

const drawFoot = (ctx, side, pose) => {
  const stride = Math.sin(pose.phase + (side > 0 ? Math.PI : 0));
  const lift = pose.air > 0.02 ? 6 : pose.running ? Math.max(0, stride) * 9 : 0;
  const spread = side * (11 + pose.slide * 5);
  ctx.strokeStyle = '#8f9ccc';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(side * 9, -16);
  ctx.lineTo(spread, -7 - lift);
  ctx.stroke();
  if (pose.air > 0.02) {
    // Jatinhos nos pes enquanto esta no ar.
    const flame = 7 + Math.sin(pose.time * 50 + side) * 3;
    ctx.fillStyle = 'rgba(255, 190, 80, 0.9)';
    ctx.beginPath();
    ctx.moveTo(spread - 4, -4 - lift);
    ctx.lineTo(spread + 4, -4 - lift);
    ctx.lineTo(spread, -4 - lift + flame);
    ctx.closePath();
    ctx.fill();
  }
  roundRectPath(ctx, spread - 7, -10 - lift, 14, 9, 4.5);
  ctx.fillStyle = INK;
  ctx.fill();
};

const drawBody = (ctx) => {
  const shell = ctx.createRadialGradient(-9, BODY_Y - 12, 3, 0, BODY_Y, BODY_R * 1.15);
  shell.addColorStop(0, '#ffffff');
  shell.addColorStop(0.6, '#dfe6fa');
  shell.addColorStop(1, '#98a5d6');
  ctx.fillStyle = shell;
  ctx.beginPath();
  ctx.arc(0, BODY_Y, BODY_R, 0, TAU);
  ctx.fill();
  // Faixa colorida na cintura, recortada no corpo.
  ctx.save();
  ctx.clip();
  ctx.fillStyle = TEAL;
  ctx.fillRect(-BODY_R, BODY_Y + 9, BODY_R * 2, 7);
  ctx.fillStyle = 'rgba(40, 30, 90, 0.16)';
  ctx.fillRect(-BODY_R, BODY_Y + 16, BODY_R * 2, BODY_R);
  ctx.restore();
  ctx.strokeStyle = 'rgba(60, 50, 120, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, BODY_Y, BODY_R, 0, TAU);
  ctx.stroke();
};

const drawArms = (ctx, pose) => {
  [-1, 1].forEach((side) => {
    const swing = pose.running ? Math.sin(pose.phase) * side * 5 : Math.sin(pose.time * 2 + side) * 1.5;
    const wave = pose.front && side > 0 ? -16 - Math.sin(pose.time * 6) * 4 : 0;
    roundRectPath(ctx, side * BODY_R - 4, BODY_Y - 8, 8, 15, 4);
    ctx.fillStyle = '#149c92';
    ctx.fill();
    ctx.fillStyle = '#eef2ff';
    ctx.strokeStyle = 'rgba(60, 50, 120, 0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(side * (BODY_R + 5), BODY_Y + 9 + swing + wave, 5.5, 0, TAU);
    ctx.fill();
    ctx.stroke();
  });
};

// De costas (durante a corrida) aparece o pacote da entrega.
const drawParcel = (ctx) => {
  const box = ctx.createLinearGradient(0, BODY_Y - 20, 0, BODY_Y + 6);
  box.addColorStop(0, '#f0b877');
  box.addColorStop(1, '#c98a48');
  roundRectPath(ctx, -15, BODY_Y - 20, 30, 25, 4);
  ctx.fillStyle = box;
  ctx.fill();
  ctx.strokeStyle = 'rgba(110, 66, 20, 0.6)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = '#fbe6bd';
  ctx.fillRect(-3, BODY_Y - 20, 6, 25);
  ctx.fillRect(-15, BODY_Y - 10, 30, 5);
  ctx.fillStyle = '#ff5a6e';
  ctx.beginPath();
  ctx.arc(9, BODY_Y - 1, 2.2, 0, TAU);
  ctx.fill();
};

// De frente (tela inicial) aparece o visor com os olhos.
const drawFace = (ctx, time) => {
  roundRectPath(ctx, -18, BODY_Y - 15, 36, 21, 9);
  ctx.fillStyle = '#1c1640';
  ctx.fill();
  const blink = time % 3.4 > 3.25 ? 0.15 : 1;
  ctx.fillStyle = '#7df6ff';
  ctx.shadowColor = '#7df6ff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.ellipse(-7.5, BODY_Y - 5, 3.6, 5 * blink, 0, 0, TAU);
  ctx.ellipse(7.5, BODY_Y - 5, 3.6, 5 * blink, 0, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#7df6ff';
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, BODY_Y, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
};

const drawAntenna = (ctx, pose) => {
  const sway = -pose.tilt * 22 + Math.sin(pose.phase * 2) * (pose.running ? 1.6 : 0.6) - pose.vy * 0.4;
  const tipX = sway;
  const tipY = BODY_Y - BODY_R - 17;
  ctx.strokeStyle = '#8f9ccc';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, BODY_Y - BODY_R + 1);
  ctx.quadraticCurveTo(0, tipY + 4, tipX, tipY);
  ctx.stroke();
  const pulse = 0.5 + 0.5 * Math.sin(pose.time * 6);
  ctx.fillStyle = `rgba(125, 246, 255, ${0.25 + pulse * 0.2})`;
  ctx.beginPath();
  ctx.arc(tipX, tipY, 7.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#c8fbff';
  ctx.beginPath();
  ctx.arc(tipX, tipY, 3.6, 0, TAU);
  ctx.fill();
};

const drawAuras = (ctx, pose) => {
  if (pose.magnet) {
    ctx.strokeStyle = 'rgba(255, 90, 130, 0.8)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([9, 7]);
    ctx.lineDashOffset = -pose.time * 40;
    ctx.beginPath();
    ctx.arc(0, BODY_Y, 47 + Math.sin(pose.time * 8) * 2, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (pose.shield) {
    const radius = 42 + Math.sin(pose.time * 4) * 1.2;
    const bubble = ctx.createRadialGradient(0, BODY_Y, radius * 0.55, 0, BODY_Y, radius);
    bubble.addColorStop(0, 'rgba(120, 220, 255, 0)');
    bubble.addColorStop(1, 'rgba(120, 220, 255, 0.42)');
    ctx.fillStyle = bubble;
    ctx.beginPath();
    ctx.arc(0, BODY_Y, radius, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(200, 245, 255, 0.9)';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, BODY_Y, radius - 6, 1.15 * Math.PI, 1.4 * Math.PI);
    ctx.stroke();
  }
};

// Sombra macia no chao: encolhe e clareia conforme o robo sobe.
const drawRobotShadow = (ctx, x, y, scale, air) => {
  const k = (scale / PLAYER_SCALE) * Math.max(0.45, 1 - air * 0.3);
  ctx.fillStyle = `rgba(14, 6, 46, ${Math.max(0.1, 0.34 - air * 0.12)})`;
  ctx.beginPath();
  ctx.ellipse(x, y, 30 * k, 8.5 * k, 0, 0, TAU);
  ctx.fill();
};

/**
 * @param {CanvasRenderingContext2D} ctx
 * @param {object} pose { x, y, scale, phase, time, air, vy, slide, tilt, running, front, alpha, shield, magnet, crash }
 *   `x`/`y` sao os pes na tela; `slide` vai de 0 a 1; `crash` sao os segundos desde a batida (ou -1).
 */
const drawRobot = (ctx, pose) => {
  const k = pose.scale / PLAYER_SCALE;
  const fall = pose.crash >= 0 ? Math.min(1, pose.crash / 0.55) : 0;
  const stretch = pose.air > 0.02 ? Math.max(-0.12, Math.min(0.14, pose.vy * 0.014)) : 0;
  const sy = (1 + stretch) * (1 - pose.slide * 0.4);
  const sx = (1 - stretch * 0.7) * (1 + pose.slide * 0.22);
  const bob = pose.running && pose.air <= 0.02 ? -Math.abs(Math.sin(pose.phase)) * 3.2 : Math.sin(pose.time * 2.4) * 1.2;
  ctx.save();
  ctx.globalAlpha = pose.alpha;
  ctx.translate(pose.x + fall * 16 * k, pose.y - (Math.sin(fall * Math.PI) * 34 + fall * 24) * k);
  ctx.scale(k, k);
  ctx.rotate(pose.tilt + fall * 1.75);
  ctx.scale(sx, sy);
  ctx.translate(0, bob * (1 - pose.slide) * (1 - fall));
  drawFoot(ctx, -1, pose);
  drawFoot(ctx, 1, pose);
  drawArms(ctx, pose);
  drawBody(ctx);
  if (pose.front) drawFace(ctx, pose.time);
  else drawParcel(ctx);
  drawAntenna(ctx, pose);
  drawAuras(ctx, pose);
  ctx.restore();
};


const c=document.querySelector('canvas'),ctx=c.getContext('2d');
const W=c.width,H=c.height,P=H>W;
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function star(x,y,r,color='#fff6ba'){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=20;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,rr=i%2?r*.19:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function burst(x,y,r,color){ctx.save();ctx.translate(x,y);for(let i=0;i<26;i++){ctx.rotate(Math.PI*2/26);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r,-r*.028);ctx.lineTo(r,r*.028);ctx.fill()}ctx.restore()}
function trail(ax,ay,bx,by,cx,cy,color,width){ctx.save();ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=22;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(bx,by,cx,cy);ctx.stroke();ctx.strokeStyle='#fffde6';ctx.lineWidth=width*.28;ctx.stroke();ctx.restore()}
function title(lines,ys,maxWidth,size,x){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';lines.forEach((line,i)=>{ctx.font=`1000 ${size}px "Arial Black", "Segoe UI", sans-serif`;let s=size*Math.min(1,maxWidth/ctx.measureText(line).width);ctx.font=`1000 ${s}px "Arial Black", "Segoe UI", sans-serif`;ctx.shadowColor='#9d56ff';ctx.shadowBlur=30;ctx.strokeStyle='#190b38';ctx.lineWidth=23;ctx.strokeText(line,x,ys[i]+8);ctx.shadowBlur=0;ctx.strokeStyle='#190b38';ctx.lineWidth=17;ctx.strokeText(line,x,ys[i]);ctx.strokeStyle='#ffe5a3';ctx.lineWidth=3;ctx.strokeText(line,x,ys[i]);let g=ctx.createLinearGradient(0,ys[i]-s*.5,0,ys[i]+s*.5);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#fff5b9');g.addColorStop(1,'#ffbb36');ctx.fillStyle=g;ctx.fillText(line,x,ys[i])});ctx.restore()}
function vignette(){let g=ctx.createRadialGradient(W*.52,H*.55,W*.25,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,'transparent');g.addColorStop(1,'#06051b8a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function scene(){ctx.save();ctx.translate(P?0:540,P?490:55);ctx.scale(P?1.08:.68,P?1.08:.68)}

function poly(points,col){ctx.fillStyle=col;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function line(x,y,a,b,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}
function rr(x,y,w,h,r,col){roundRectPath(ctx,x,y,w,h,r);ctx.fillStyle=col;ctx.fill()}
function art(){ctx.save();ctx.translate(P?40:570,P?485:35);ctx.scale(P?1:.65,P?1:.65)}
function heading(a,b){if(P)title([a,b],[185,340],850,150,540);else title([a,b],[225,360],435,105,315)}


let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#46358c');sky.addColorStop(.45,'#ec8aa1');sky.addColorStop(.75,'#ffc586');sky.addColorStop(1,'#685da3');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
art();glow(530,350,500,'#ffebae99');ellipse(530,350,190,190,'#ffe9ae');burst(530,350,1300,'#fff3c51c');
for(let i=0;i<32;i++){let x=(i*217%1300)-150,y=410+(i*127%700);ellipse(x,y,115+i%4*26,35+i%3*17,i%2?'#fff0dc':'#b6a5db')}
poly([[455,390],[610,390],[1160,1180],[-180,1180]],'#444260');poly([[455,390],[610,390],[1110,1140],[-130,1140]],'#9b99c5');
line(455,390,-130,1140,'#bafaff',14);line(610,390,1110,1140,'#bafaff',14);
for(const t of [.333,.667])line(455+155*t,390,-130+1240*t,1140,'#eee4fa',7);
for(let i=0;i<7;i++){let y=450+i*i*15;line(425-(y-450)*.5,y,650+(y-450)*.6,y,'#ffffff33',4)}
// Yellow jump barrier and its dark hazard stripes, matching obstacles.js.
poly([[325,840],[705,840],[735,875],[295,875]],'#fff0a0');rr(295,875,440,115,14,'#f2a900');
for(let i=0;i<6;i++)poly([[310+i*70,974],[345+i*70,974],[385+i*70,891],[350+i*70,891]],'#2b2140');
// Purple drone with red sensor and downwards beam.
poly([[785,530],[815,530],[920,900],[680,900]],'#ff465a33');line(725,510,875,510,'#2a2350',13);ellipse(720,500,48,9,'#eeeaffaa');ellipse(880,500,48,9,'#eeeaffaa');ellipse(800,530,64,42,'#51468d');ellipse(800,540,23,23,'#ffd9de');ellipse(800,540,15,15,'#ff2d4a');
for(let i=0;i<7;i++){let x=180+i*42,y=930-i*77,r=43-i*3;ellipse(x,y,r*.8,r,'#b87513');ellipse(x-4,y-4,r*.72,r*.89,'#ffd94e');ellipse(x-5,y-6,r*.45,r*.66,'#ffed8c');star(x-12,y-24,12)}
// Exact game robot, enlarged and facing the viewer in a jump.
glow(510,640,270,'#c9fbff66');drawRobot(ctx,{x:520,y:820,scale:6.6,phase:1.3,time:.6,air:1,vy:1,slide:0,tilt:-.12,running:true,front:true,alpha:1,shield:false,magnet:false,crash:-1});
for(let i=0;i<12;i++){let x=i%2?70:960,y=500+i*52;line(x,y,x+(i%2?-150:150),y+130,'#fff4d866',5)}
[[310,480,28],[710,720,25],[185,1000,25],[900,1030,30]].forEach(s=>star(...s));ctx.restore();vignette();heading('CORRIDA','NAS NUVENS');

</script>
