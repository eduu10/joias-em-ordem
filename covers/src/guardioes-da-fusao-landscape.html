// Numeros de balanceamento e o mapa. O jogo e desenhado num espaco fixo de 360 x 640 e escalado para a tela.
const DESIGN = Object.freeze({ w: 360, h: 640 });

const PHASE = Object.freeze({ TITLE: 'title', BUILD: 'build', WAVE: 'wave', OVER: 'over' });

// Caminho dos inimigos, da caverna ate o castelo.
const PATH = Object.freeze([
  [300, 58], [300, 124], [70, 124], [70, 256], [290, 256], [290, 386], [180, 386], [180, 452],
].map((point) => Object.freeze(point)));

const BASE = Object.freeze({ x: 180, y: 470 });

// Pedestais onde os guardioes ficam. Os primeiros sao os mais bem posicionados.
const SLOTS = Object.freeze([
  [190, 190], [130, 190], [250, 190],
  [170, 321], [230, 321], [110, 321],
  [175, 66], [240, 66], [110, 66],
  [108, 412], [252, 446], [100, 482],
].map(([x, y]) => Object.freeze({ x, y })));

const CONFIG = Object.freeze({
  maxTier: 9,
  baseHp: 10,
  startCoins: 50,
  buyBaseCost: 20,
  buyCostGrowth: 1.13,
  heroDamage: 5,
  heroDamageGrowth: 2.15,
  heroCooldown: 0.8,
  heroRange: 88,
  heroRangePerTier: 5,
  shotSpeed: 340,
  enemyHp: 13,
  enemyHpGrowth: 1.21,
  enemySpeed: 34,
  enemySpeedPerWave: 1.2,
  enemySpeedBonusCap: 24,
  enemyCount: 6,
  enemyCountPerWave: 2,
  enemyCountCap: 36,
  spawnInterval: 0.85,
  spawnIntervalMin: 0.4,
  spawnIntervalPerWave: 0.02,
  rewardBase: 2,
  wavesPerRewardStep: 3,
  bossEvery: 5,
  bossHpFactor: 12,
  bossSpeedFactor: 0.6,
  bossRewardFactor: 10,
  bossLeakDamage: 5,
  waveBonus: 8,
  waveBonusPerWave: 2,
  buildSeconds: 2.5,
  firstBuildSeconds: 4,
  interstitialEveryRuns: 2,
  maxFrameSeconds: 0.05,
  saveVersion: 1,
});

const REWARD_ID_REVIVE = 'revive-castle';

// Ajudantes de desenho usados por todos os modulos visuais.
const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const hsl = ([h, s, l], lightShift = 0, alpha = 1) =>
  `hsl(${h} ${s}% ${Math.min(100, Math.max(0, l + lightShift))}% / ${alpha})`;

const roundRectPath = (ctx, x, y, w, h, radius) => {
  const r = Math.min(radius, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

const drawText = (ctx, text, x, y, size, options = {}) => {
  const { color = '#ffffff', weight = 800, align = 'center', shadow = true } = options;
  ctx.font = `${weight} ${Math.round(size)}px ${FONT_STACK}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.fillStyle = 'rgba(20, 8, 50, 0.45)';
    ctx.fillText(text, x, y + Math.max(1, size * 0.07));
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
};

// Reduz o tamanho da fonte ate o texto caber na largura dada.
const fitText = (ctx, text, maxWidth, size, weight = 800) => {
  ctx.font = `${weight} ${Math.round(size)}px ${FONT_STACK}`;
  const width = ctx.measureText(text).width;
  return width <= maxWidth ? size : size * (maxWidth / width);
};

// Personagens: guardioes (magos), monstros e os disparos de magia.
const TAU = Math.PI * 2;
const TIER_HUES = Object.freeze([205, 145, 48, 22, 330, 275, 180, 0, 52]);
const SKIN = '#ffd9b3';
const GOLD = '#ffd23f';

const tierHue = (tier) => TIER_HUES[(tier - 1) % TIER_HUES.length];
const tint = (tier, light, alpha = 1) => `hsl(${tierHue(tier)} 82% ${light}% / ${alpha})`;

const drawAura = (ctx, tier, time) => {
  const pulse = 0.5 + 0.5 * Math.sin(time * 3 + tier);
  const glow = ctx.createRadialGradient(0, -14, 2, 0, -14, 30 + pulse * 4);
  glow.addColorStop(0, tint(tier, 70, 0.4));
  glow.addColorStop(1, tint(tier, 70, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, -14, 34, 0, TAU);
  ctx.fill();
};

const drawHat = (ctx, tier) => {
  if (tier >= 7) {
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.moveTo(-9, -37);
    ctx.lineTo(-9, -47);
    ctx.lineTo(-4.5, -42);
    ctx.lineTo(0, -49);
    ctx.lineTo(4.5, -42);
    ctx.lineTo(9, -47);
    ctx.lineTo(9, -37);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = tint(tier, 55);
    ctx.beginPath();
    ctx.arc(0, -41, 1.8, 0, TAU);
    ctx.fill();
    return;
  }
  ctx.fillStyle = tint(tier, 38);
  ctx.beginPath();
  ctx.ellipse(0, -37, 13, 3.6, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = tint(tier, 46);
  ctx.beginPath();
  ctx.moveTo(-8.5, -37);
  ctx.quadraticCurveTo(-3, -52, 6, -57);
  ctx.quadraticCurveTo(4, -46, 8.5, -37);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = tier >= 4 ? GOLD : tint(tier, 68);
  ctx.fillRect(-8, -40.5, 16, 2.6);
};

const drawStaff = (ctx, tier, time) => {
  ctx.strokeStyle = '#7a4a22';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(13, -2);
  ctx.lineTo(15, -34);
  ctx.stroke();
  const pulse = 0.5 + 0.5 * Math.sin(time * 5 + tier);
  ctx.fillStyle = tint(tier, 72, 0.35);
  ctx.beginPath();
  ctx.arc(15, -37, 7 + pulse * 1.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = tint(tier, 62);
  ctx.beginPath();
  ctx.arc(15, -37, 4.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.arc(13.8, -38.4, 1.4, 0, TAU);
  ctx.fill();
};

// `options`: { time, recoil (0 a 1), alpha, lifted }
const drawHero = (ctx, x, y, tier, options = {}) => {
  const { time = 0, recoil = 0, alpha = 1, lifted = false } = options;
  const size = 1 + (tier - 1) * 0.045 + (lifted ? 0.12 : 0);
  const bob = Math.sin(time * 2.4 + x * 0.05) * 1.1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y + bob - recoil * 2);
  ctx.scale(size, size * (1 - recoil * 0.06));

  if (tier >= 5) drawAura(ctx, tier, time);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
  ctx.beginPath();
  ctx.ellipse(0, lifted ? 12 : 1, 12, 4, 0, 0, TAU);
  ctx.fill();

  // Manto.
  const robe = ctx.createLinearGradient(0, -24, 0, 2);
  robe.addColorStop(0, tint(tier, 60));
  robe.addColorStop(1, tint(tier, 40));
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-12, 1);
  ctx.quadraticCurveTo(-11, -22, 0, -24);
  ctx.quadraticCurveTo(11, -22, 12, 1);
  ctx.quadraticCurveTo(0, 5, -12, 1);
  ctx.fill();
  ctx.fillStyle = tier >= 4 ? GOLD : tint(tier, 76);
  ctx.fillRect(-1.3, -22, 2.6, 22);

  drawStaff(ctx, tier, time);

  // Cabeca.
  ctx.fillStyle = SKIN;
  ctx.beginPath();
  ctx.arc(0, -29, 9, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#3a2a4d';
  ctx.beginPath();
  ctx.arc(-3.2, -29.5, 1.4, 0, TAU);
  ctx.arc(3.2, -29.5, 1.4, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 120, 120, 0.5)';
  ctx.beginPath();
  ctx.arc(-5.6, -26.2, 1.7, 0, TAU);
  ctx.arc(5.6, -26.2, 1.7, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#3a2a4d';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, -27, 2.6, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
  drawHat(ctx, tier);
  ctx.restore();

};
const enemyHue = (enemy) => Math.max(-70, 115 - Math.log2(enemy.maxHp / 13 + 1) * 34);

const drawEnemy = (ctx, enemy, x, y, time) => {
  const radius = enemy.boss ? 17 : 10.5;
  const wobble = Math.sin(time * 7 + enemy.id * 1.7);
  const hue = enemy.boss ? 285 : enemyHue(enemy);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(0, radius * 0.55, radius * 0.95, radius * 0.32, 0, 0, TAU);
  ctx.fill();

  ctx.scale(1 + wobble * 0.06, 1 - wobble * 0.06);
  if (enemy.boss) {
    ctx.fillStyle = '#f1e6c8';
    [[-1, 1], [1, 1]].forEach(([side]) => {
      ctx.beginPath();
      ctx.moveTo(side * radius * 0.45, -radius * 0.75);
      ctx.lineTo(side * radius * 0.95, -radius * 1.5);
      ctx.lineTo(side * radius * 0.8, -radius * 0.5);
      ctx.closePath();
      ctx.fill();
    });
  }
  const body = ctx.createRadialGradient(-radius * 0.3, -radius * 0.5, 1, 0, 0, radius * 1.2);
  body.addColorStop(0, `hsl(${hue} 78% 68%)`);
  body.addColorStop(1, `hsl(${hue} 74% 40%)`);
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-radius, radius * 0.5);
  ctx.bezierCurveTo(-radius * 1.1, -radius * 0.7, -radius * 0.5, -radius * 1.1, 0, -radius * 1.05);
  ctx.bezierCurveTo(radius * 0.5, -radius * 1.1, radius * 1.1, -radius * 0.7, radius, radius * 0.5);
  ctx.quadraticCurveTo(0, radius * 0.85, -radius, radius * 0.5);
  ctx.fill();
  ctx.strokeStyle = `hsl(${hue} 70% 26% / 0.7)`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-radius * 0.36, -radius * 0.28, radius * 0.27, 0, TAU);
  ctx.arc(radius * 0.36, -radius * 0.28, radius * 0.27, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#1d1230';
  ctx.beginPath();
  ctx.arc(-radius * 0.3, -radius * 0.24, radius * 0.13, 0, TAU);
  ctx.arc(radius * 0.42, -radius * 0.24, radius * 0.13, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#1d1230';
  ctx.lineWidth = enemy.boss ? 2 : 1.3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-radius * 0.68, -radius * 0.66);
  ctx.lineTo(-radius * 0.14, -radius * 0.5);
  ctx.moveTo(radius * 0.68, -radius * 0.66);
  ctx.lineTo(radius * 0.14, -radius * 0.5);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.beginPath();
  ctx.ellipse(-radius * 0.45, -radius * 0.78, radius * 0.22, radius * 0.1, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (enemy.hp < enemy.maxHp) {
    const width = radius * 2.2;
    const top = y - radius * (enemy.boss ? 1.9 : 1.55);
    ctx.fillStyle = 'rgba(20, 10, 40, 0.7)';
    ctx.fillRect(x - width / 2 - 1, top - 1, width + 2, 5);
    ctx.fillStyle = enemy.boss ? '#c77dff' : '#ff5d5d';
    ctx.fillRect(x - width / 2, top, width * Math.max(0, enemy.hp / enemy.maxHp), 3);
  }
};

const drawShot = (ctx, shot) => {
  const glow = ctx.createRadialGradient(shot.x, shot.y, 0, shot.x, shot.y, 8);
  glow.addColorStop(0, tint(shot.tier, 85, 0.95));
  glow.addColorStop(0.4, tint(shot.tier, 62, 0.7));
  glow.addColorStop(1, tint(shot.tier, 60, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(shot.x, shot.y, 8, 0, TAU);
  ctx.fill();
};

const drawRange = (ctx, slot, range, tier) => {
  ctx.fillStyle = tint(tier, 70, 0.14);
  ctx.strokeStyle = tint(tier, 80, 0.7);
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.arc(slot.x, slot.y, range, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.setLineDash([]);
};

const drawSlotGlow = (ctx, slot, tier, pulse) => {
  ctx.strokeStyle = tint(tier, 78, 0.6 + pulse * 0.4);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(slot.x, slot.y, 23 + pulse * 3, 10 + pulse * 1.5, 0, 0, TAU);
  ctx.stroke();
};

// Cenario parado: grama, caminho, arvores, caverna, castelo e pedestais.
// E desenhado uma vez num canvas auxiliar e depois so copiado a cada quadro.

const TREES = Object.freeze([[30, 96], [38, 196], [22, 318], [336, 200], [340, 330], [28, 452], [336, 508], [28, 590], [334, 600], [346, 128]]);
const ROCKS = Object.freeze([[18, 150], [330, 440], [150, 540], [226, 498], [52, 380]]);
const FLOWER_COUNT = 46;
const TUFT_COUNT = 70;

const worldNoise = (index, salt) => {
  const value = Math.sin(index * 127.1 + salt * 311.7) * 43758.5453;
  return value - Math.floor(value);
};

const tracePath = (ctx) => {
  ctx.beginPath();
  PATH.forEach(([x, y], index) => (index === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
  ctx.lineTo(BASE.x, BASE.y);
};

const drawGround = (ctx, bounds) => {
  const grass = ctx.createLinearGradient(0, 0, 0, DESIGN.h);
  grass.addColorStop(0, '#8fd45a');
  grass.addColorStop(1, '#4fae45');
  ctx.fillStyle = grass;
  ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);

  for (let i = 0; i < 26; i += 1) {
    ctx.fillStyle = `rgba(255, 255, 190, ${0.05 + worldNoise(i, 1) * 0.07})`;
    ctx.beginPath();
    ctx.ellipse(bounds.x + worldNoise(i, 2) * bounds.w, bounds.y + worldNoise(i, 3) * bounds.h, 30 + worldNoise(i, 4) * 50, 16 + worldNoise(i, 5) * 22, 0, 0, TAU);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(40, 120, 50, 0.45)';
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  for (let i = 0; i < TUFT_COUNT; i += 1) {
    const x = bounds.x + worldNoise(i, 6) * bounds.w;
    const y = bounds.y + worldNoise(i, 7) * bounds.h;
    ctx.beginPath();
    ctx.moveTo(x - 3, y);
    ctx.lineTo(x - 4, y - 5);
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - 7);
    ctx.moveTo(x + 3, y);
    ctx.lineTo(x + 4, y - 5);
    ctx.stroke();
  }
};

const drawRoad = (ctx) => {
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  [['rgba(30, 70, 30, 0.35)', 52, 3], ['#8a6436', 46, 0], ['#d8b27a', 40, 0], ['#e7c893', 26, -1]].forEach(([color, width, shift]) => {
    ctx.save();
    ctx.translate(0, shift);
    tracePath(ctx);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
    ctx.restore();
  });
  for (let i = 0; i < 60; i += 1) {
    const [x1, y1] = PATH[Math.floor(worldNoise(i, 8) * (PATH.length - 1))];
    const [x2, y2] = PATH[Math.min(PATH.length - 1, Math.floor(worldNoise(i, 8) * (PATH.length - 1)) + 1)];
    const t = worldNoise(i, 9);
    ctx.fillStyle = `rgba(120, 84, 44, ${0.25 + worldNoise(i, 10) * 0.25})`;
    ctx.beginPath();
    ctx.ellipse(x1 + (x2 - x1) * t + (worldNoise(i, 11) - 0.5) * 30, y1 + (y2 - y1) * t + (worldNoise(i, 12) - 0.5) * 30, 2.4, 1.6, 0, 0, TAU);
    ctx.fill();
  }
};

const drawFlowers = (ctx) => {
  const colors = ['#ffffff', '#ffe066', '#ff9ecb', '#b5a1ff'];
  for (let i = 0; i < FLOWER_COUNT; i += 1) {
    const x = worldNoise(i, 13) * DESIGN.w;
    const y = worldNoise(i, 14) * DESIGN.h;
    ctx.fillStyle = colors[i % colors.length];
    for (let petal = 0; petal < 5; petal += 1) {
      const angle = (petal * TAU) / 5;
      ctx.beginPath();
      ctx.arc(x + Math.cos(angle) * 2.2, y + Math.sin(angle) * 2.2, 1.5, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#ffb703';
    ctx.beginPath();
    ctx.arc(x, y, 1.3, 0, TAU);
    ctx.fill();
  }
};

const drawTree = (ctx, x, y) => {
  ctx.fillStyle = 'rgba(20, 70, 30, 0.35)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 4, 19, 7, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#7a4a22';
  ctx.fillRect(x - 3, y - 12, 6, 16);
  [[0, -26, 17, '#2f8f3e'], [-9, -18, 12, '#35a047'], [9, -18, 12, '#2a8338'], [0, -31, 12, '#4cbb5a']].forEach(([dx, dy, r, color]) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x + dx, y + dy, r, 0, TAU);
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.beginPath();
  ctx.arc(x - 5, y - 35, 6, 0, TAU);
  ctx.fill();
};

const drawRock = (ctx, x, y) => {
  ctx.fillStyle = 'rgba(20, 60, 30, 0.3)';
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 5, 12, 4, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#8d97a8';
  ctx.beginPath();
  ctx.ellipse(x, y, 10, 7.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#b9c1cf';
  ctx.beginPath();
  ctx.ellipse(x - 2.5, y - 2.5, 5, 3, -0.4, 0, TAU);
  ctx.fill();
};

const drawCave = (ctx) => {
  const [x, y] = PATH[0];
  ctx.fillStyle = 'rgba(20, 60, 30, 0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 40, 9, 0, 0, TAU);
  ctx.fill();
  const rock = ctx.createLinearGradient(0, y - 40, 0, y + 10);
  rock.addColorStop(0, '#9aa3b5');
  rock.addColorStop(1, '#646c7e');
  ctx.fillStyle = rock;
  ctx.beginPath();
  ctx.moveTo(x - 38, y + 8);
  ctx.quadraticCurveTo(x - 36, y - 30, x - 10, y - 38);
  ctx.quadraticCurveTo(x + 8, y - 46, x + 24, y - 30);
  ctx.quadraticCurveTo(x + 42, y - 16, x + 38, y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1b1430';
  ctx.beginPath();
  ctx.moveTo(x - 19, y + 8);
  ctx.quadraticCurveTo(x - 19, y - 22, x, y - 22);
  ctx.quadraticCurveTo(x + 19, y - 22, x + 19, y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(190, 80, 255, 0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 12, 5, 0, 0, TAU);
  ctx.fill();
};

const drawCastle = (ctx) => {
  const { x, y } = BASE;
  ctx.fillStyle = 'rgba(20, 60, 30, 0.38)';
  ctx.beginPath();
  ctx.ellipse(x, y + 16, 42, 10, 0, 0, TAU);
  ctx.fill();

  const stone = ctx.createLinearGradient(x - 30, 0, x + 30, 0);
  stone.addColorStop(0, '#d9dde8');
  stone.addColorStop(1, '#9ea6b8');
  const tower = (cx, top, width, height) => {
    ctx.fillStyle = stone;
    ctx.fillRect(cx - width / 2, top, width, height);
    for (let i = 0; i < 3; i += 1) ctx.fillRect(cx - width / 2 + i * (width / 2.5), top - 5, width / 5, 6);
  };
  tower(x - 24, y - 22, 16, 38);
  tower(x + 24, y - 22, 16, 38);
  tower(x, y - 14, 36, 30);
  ctx.fillStyle = '#e2584d';
  [[x - 24, y - 27, 12], [x + 24, y - 27, 12]].forEach(([cx, top, half]) => {
    ctx.beginPath();
    ctx.moveTo(cx - half, top);
    ctx.lineTo(cx, top - 20);
    ctx.lineTo(cx + half, top);
    ctx.closePath();
    ctx.fill();
  });
  ctx.fillStyle = '#5b3a1e';
  ctx.beginPath();
  ctx.moveTo(x - 8, y + 16);
  ctx.lineTo(x - 8, y + 2);
  ctx.quadraticCurveTo(x, y - 8, x + 8, y + 2);
  ctx.lineTo(x + 8, y + 16);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#5b3a1e';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - 19);
  ctx.lineTo(x, y - 40);
  ctx.stroke();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.moveTo(x, y - 40);
  ctx.lineTo(x + 14, y - 35);
  ctx.lineTo(x, y - 30);
  ctx.closePath();
  ctx.fill();
};

const drawPedestal = (ctx, slot) => {
  ctx.fillStyle = 'rgba(20, 60, 30, 0.35)';
  ctx.beginPath();
  ctx.ellipse(slot.x, slot.y + 8, 23, 8, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#7f8798';
  ctx.beginPath();
  ctx.ellipse(slot.x, slot.y + 5, 20, 8, 0, 0, TAU);
  ctx.fill();

};

// `view`: { width, height, ratio, scale, ox, oy } em pixels de tela.
const buildWorld = (view) => {
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(view.width * view.ratio);
  canvas.height = Math.round(view.height * view.ratio);
  const ctx = canvas.getContext('2d');
  const k = view.ratio * view.scale;
  ctx.setTransform(k, 0, 0, k, view.ox * view.ratio, view.oy * view.ratio);
  const bounds = { x: -view.ox / view.scale, y: -view.oy / view.scale, w: view.width / view.scale, h: view.height / view.scale };

  drawGround(ctx, bounds);
  drawFlowers(ctx);
  drawRoad(ctx);
  ROCKS.forEach(([x, y]) => drawRock(ctx, x, y));
  drawCave(ctx);
  SLOTS.forEach((slot) => drawPedestal(ctx, slot));
  drawCastle(ctx);
  TREES.forEach(([x, y]) => drawTree(ctx, x, y));
  return canvas;
};
